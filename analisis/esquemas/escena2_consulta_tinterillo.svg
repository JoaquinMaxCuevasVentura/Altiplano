<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800"><defs><marker id="arri" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#222"/></marker><marker id="arrc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c2410c"/></marker></defs><rect width="1100" height="800" fill="white"/><text x="30" y="38" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Escena 2 · La consulta del tinterillo (pp. 103-105)</tspan></text><text x="30" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#6b7280" text-anchor="start"><tspan x="30" dy="0">Inventario de lo que da el texto, en planta. No es un boceto de la figura.</tspan></text><line x1="800" y1="24" x2="840" y2="24" stroke="#222" stroke-width="2"/><text x="850" y="28" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="850" dy="0">lo da el texto (con página)</tspan></text><line x1="800" y1="44" x2="840" y2="44" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="48" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="850" dy="0">lo decide y declara el dibujo</tspan></text><text x="800" y="68" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="800" dy="0">gris cursiva: valoración del narrador</tspan></text><rect x="60" y="130" width="480" height="360" rx="0" fill="#faf6ef" stroke="#222" stroke-width="2.5"/><text x="60" y="122" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="60" dy="0">«un cuartucho maloliente, de piso de ladrillos» (p. 103)</tspan></text><line x1="60" y1="508" x2="540" y2="508" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="300" y="526" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="300" dy="0">medidas, ventana y luz: ?</tspan></text><rect x="220" y="270" width="160" height="80" rx="0" fill="#e7dcc8" stroke="#222" stroke-width="2"/><circle cx="240" cy="290" r="6" fill="#222" stroke="#222" stroke-width="2"/><rect x="258" y="282" width="34" height="22" rx="0" fill="white" stroke="#222" stroke-width="1"/><rect x="264" y="279" width="34" height="22" rx="0" fill="white" stroke="#222" stroke-width="1"/><rect x="270" y="276" width="34" height="22" rx="0" fill="white" stroke="#222" stroke-width="1"/><rect x="276" y="273" width="34" height="22" rx="0" fill="white" stroke="#222" stroke-width="1"/><circle cx="200" cy="262" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="200" y="266.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="200" dy="0">1</tspan></text><rect x="318" y="300" width="50" height="36" rx="0" fill="#8b5e3c" stroke="#222" stroke-width="1.5"/><rect x="290" y="318" width="20" height="15" rx="0" fill="#8b5e3c" stroke="#222" stroke-width="1.5"/><circle cx="392" cy="336" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="392" y="340.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="392" dy="0">2</tspan></text><rect x="179" y="289" width="22" height="22" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><rect x="399" y="289" width="22" height="22" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><rect x="139" y="379" width="22" height="22" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><circle cx="150" cy="420" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="150" y="424.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="150" dy="0">3</tspan></text><rect x="80" y="150" width="130" height="40" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="145" y="175" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="145" dy="0">sofá</tspan></text><circle cx="225" cy="170" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="225" y="174.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="225" dy="0">4</tspan></text><circle cx="300" cy="235" r="12" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="328" cy="228" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="328" y="232.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="328" dy="0">5</tspan></text><circle cx="300" cy="440" r="12" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="328" cy="448" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="328" y="452.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="328" dy="0">6</tspan></text><line x1="300" y1="426" x2="300" y2="356" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrc)"/><circle cx="272" cy="395" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="272" y="399.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="272" dy="0">9</tspan></text><line x1="130" y1="490" x2="190" y2="490" stroke="white" stroke-width="5"/><line x1="130" y1="490" x2="190" y2="490" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="160" y="482" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="160" dy="0">?</tspan></text><line x1="540" y1="380" x2="540" y2="440" stroke="white" stroke-width="5"/><line x1="540" y1="380" x2="540" y2="440" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="528" y="415" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="528" dy="0">?</tspan></text><circle cx="110" cy="470" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="110" y="474.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="110" dy="0">7</tspan></text><text x="60" y="560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="60" dy="0">8 · Fuera: la calle, donde espera la familia; Vicente sale «libre ya de la</tspan><tspan x="60" dy="16">amenaza del letrado» (p. 105).</tspan></text><text x="60" y="606" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="60" dy="0">Secuencia (pp. 104-105): promesa de «mil seiscientos bolivianos más» → con el</tspan><tspan x="60" dy="16">libro grande, «seiscientos bolivianos, la mitad adelantados» → Vicente calcula</tspan><tspan x="60" dy="16">y se niega → «cincuenta bolivianos por la consulta» y la amenaza «te encierro</tspan><tspan x="60" dy="16">por conspirar contra la autoridad municipal» → paga → oferta de cuatrocientos</tspan><tspan x="60" dy="16">→ se niega y sale.</tspan></text><text x="60" y="706" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="60" dy="0">Valoraciones del narrador: el tinterillo cuenta el dinero «con mirada de</tspan><tspan x="60" dy="16">usurpador y lengueteo de complacencia»; luego los Villca se ocultan «como</tspan><tspan x="60" dy="16">topos» (p. 105).</tspan></text><circle cx="600" cy="136" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="600" y="140.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="600" dy="0">1</tspan></text><text x="618" y="140" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="618" dy="0">«Una mugrienta mesa con un tintero y un desordenado</tspan><tspan x="618" dy="16">montón de papeles y libracos encima» (p. 103).</tspan></text><circle cx="600" cy="175" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="600" y="179.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="600" dy="0">2</tspan></text><text x="618" y="179" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="618" dy="0">«Un Código Penal en infolio y un manual del</tspan><tspan x="618" dy="16">Procedimiento Civil»: el grande «tiene más peso legal</tspan><tspan x="618" dy="16">y jurídico que el chiquitito» (p. 104).</tspan></text><circle cx="600" cy="230" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="234.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">3</tspan></text><text x="618" y="234" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">«Tres sillas» (p. 103). ¿Dónde? ¿Alguien se sienta?</tspan></text><circle cx="600" cy="253" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="257.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">4</tspan></text><text x="618" y="257" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">«Un sofá destripado» (p. 103). ¿Contra qué muro?</tspan></text><circle cx="600" cy="276" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="280.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">5</tspan></text><text x="618" y="280" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">El tinterillo, sin nombre, «el mestizo» (p. 103). ¿De</tspan><tspan x="618" dy="16">qué lado de la mesa, junto a los libros?</tspan></text><circle cx="600" cy="315" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="319.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">6</tspan></text><text x="618" y="319" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">Vicente. ¿Sentado o de pie? ¿Cerca de la salida?</tspan></text><circle cx="600" cy="338" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="342.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">7</tspan></text><text x="618" y="342" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">La salida a la calle: el texto no la describe.</tspan></text><circle cx="600" cy="361" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="600" y="365.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="600" dy="0">9</tspan></text><text x="618" y="365" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="618" dy="0">El dinero: de la faja, «un atado de pobres y traposos</tspan><tspan x="618" dy="16">billetes», a la mesa, donde el tinterillo «recontó los</tspan><tspan x="618" dy="16">billetes» (p. 105).</tspan></text><text x="30" y="772" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Pregunta del artículo: ¿qué disposición vuelve pensable la amenaza? Una geometría que omita la negativa de Vicente o la amenaza</tspan><tspan x="30" dy="18">del tinterillo reduce el conflicto que intenta comprender.</tspan></text></svg>
