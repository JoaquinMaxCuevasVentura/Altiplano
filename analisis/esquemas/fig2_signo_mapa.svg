<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="440" height="380" fill="#f6f2ea"/>
  <text x="14" y="22" font-size="13" font-weight="bold" fill="#2f2a26">Fig. 2 · Signo Escalonado frente al mapa — esquema</text>
  <text x="14" y="40" font-size="9" fill="#6b5f52">arriba: SECCIÓN del cerro (empaste, piedra a piedra) · abajo: PLANTA (incisión con punzón)</text>
  <!-- sección escalonada -->
  <path d="M40,190 L40,165 L90,165 L90,140 L140,140 L140,112 L190,112 L190,84 L250,84 L250,112 L300,112 L300,140 L350,140 L350,165 L400,165 L400,190 Z" fill="#b9826a"/>
  <g fill="#8d5a45"><circle cx="70" cy="178" r="4"/><circle cx="120" cy="152" r="4"/><circle cx="165" cy="126" r="4"/><circle cx="220" cy="98" r="4"/><circle cx="330" cy="152" r="4"/><circle cx="375" cy="178" r="4"/></g>
  <!-- chujllas por escalón -->
  <g fill="#3b3530">
    <path d="M205,84 l0,-10 l8,-7 l8,7 l0,10 Z"/>
    <path d="M100,140 l0,-8 l6,-6 l6,6 l0,8 Z"/><path d="M310,140 l0,-8 l6,-6 l6,6 l0,8 Z"/>
    <path d="M50,165 l0,-7 l5,-5 l5,5 l0,7 Z"/><path d="M65,165 l0,-7 l5,-5 l5,5 l0,7 Z"/><path d="M360,165 l0,-7 l5,-5 l5,5 l0,7 Z"/><path d="M378,165 l0,-7 l5,-5 l5,5 l0,7 Z"/>
  </g>
  <path d="M232,84 l0,-10 l8,-7 l8,7 l0,10 Z" fill="none" stroke="#b5542b" stroke-width="2"/>
  <g font-size="8.5" fill="#2f2a26">
    <text x="176" y="60">Villca (pp. 20-28)</text>
    <text x="258" y="66" fill="#b5542b">chujlla abandonada</text><text x="258" y="76" fill="#b5542b">del peón Condori (p. 35)</text>
    <text x="325" y="104">Huanca, Huallpa…</text>
    <text x="30" y="206">Condori, Mamani, Quispe: «no tienen historia» (pp. 22-23)</text>
  </g>
  <!-- líneas de proyección (diédrico) -->
  <g stroke="#6b5f52" stroke-dasharray="3,3"><line x1="40" y1="190" x2="40" y2="250"/><line x1="140" y1="140" x2="140" y2="250"/><line x1="190" y1="112" x2="190" y2="250"/><line x1="250" y1="84" x2="250" y2="250"/><line x1="350" y1="140" x2="350" y2="250"/><line x1="400" y1="190" x2="400" y2="250"/></g>
  <text x="408" y="226" font-size="8" fill="#6b5f52" transform="rotate(-90 408 226)">proyección</text>
  <!-- planta: tablero contrahecho -->
  <g stroke="#3b3530" stroke-width="1.2" fill="none">
    <path d="M40,250 L400,250 L396,350 L44,346 Z"/>
    <path d="M100,250 L96,348 M165,250 L170,349 M230,250 L226,350 M300,250 L305,350 M350,250 L346,350"/>
    <path d="M40,280 Q200,272 398,284 M42,315 Q210,322 397,312"/>
  </g>
  <!-- mojones y estacas -->
  <g fill="#b5542b"><path d="M98,250 l4,-7 l4,7 Z"/><path d="M228,250 l4,-7 l4,7 Z"/><path d="M303,350 l4,-7 l4,7 Z"/></g>
  <g stroke="#b5542b" stroke-width="2"><line x1="168" y1="283" x2="168" y2="296"/><line x1="163" y1="289" x2="173" y2="289"/></g>
  <!-- hacienda frente a iglesia -->
  <rect x="318" y="290" width="26" height="16" fill="#3b3530"/><rect x="356" y="288" width="16" height="20" fill="#3b3530"/><path d="M356,288 l8,-10 l8,10 Z" fill="#3b3530"/>
  <g font-size="8.5" fill="#2f2a26">
    <text x="44" y="366">«tablero de ajedrez un poco desigual, un poco contrahecho» (p. 9) · mojones · estacas (p. 20)</text>
    <text x="300" y="332">hacienda ↔ iglesia (p. 37)</text>
  </g>
</svg>
