<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="490" height="300" fill="#f6f2ea"/>
  <text x="14" y="22" font-size="13" font-weight="bold" fill="#2f2a26">Fig. 1 · Cráneo/nido — esquema de encaje (sección)</text>
  <g transform="translate(50,0)"><!-- cerro padre -->
  <path d="M300,240 L440,110 L440,240 Z" fill="#cfc4b4"/>
  <g fill="#b9ab96"><circle cx="360" cy="200" r="6"/><circle cx="385" cy="175" r="5"/><circle cx="410" cy="150" r="7"/><circle cx="395" cy="215" r="5"/></g>
  <text x="360" y="258" font-size="9" fill="#6b5f52">cerro «padre» (p. 8)</text>
  <path d="M345,205 C320,215 300,220 285,205" stroke="#9c8b75" stroke-dasharray="3,3" fill="none"/>
  <text x="292" y="232" font-size="8" fill="#6b5f52">sus piedras → muros</text>
  <!-- suelo -->
  <line x1="20" y1="240" x2="300" y2="240" stroke="#2f2a26" stroke-width="2"/>
  <!-- interior oscuro (hollín) -->
  <path d="M105,240 L105,150 Q185,52 265,150 L265,240 Z" fill="#3b3530"/>
  <!-- bóveda de paja = calota -->
  <path d="M82,152 Q185,32 288,152" fill="none" stroke="#8a7a62" stroke-width="10" stroke-linecap="round"/>
  <!-- muros de piedra -->
  <rect x="90" y="150" width="15" height="28" fill="#a39683"/>
  <rect x="265" y="150" width="15" height="90" fill="#a39683"/>
  <g fill="#8c806f"><circle cx="272" cy="165" r="3"/><circle cx="273" cy="190" r="3"/><circle cx="271" cy="215" r="3"/><circle cx="97" cy="163" r="3"/></g>
  <!-- vano: puerta = órbita -->
  <rect x="90" y="178" width="15" height="62" fill="#f6f2ea"/>
  <!-- viga y herramental colgado -->
  <line x1="105" y1="150" x2="265" y2="150" stroke="#c9b48f" stroke-width="3"/>
  <g stroke="#e8dcc4" stroke-width="2" fill="none">
    <line x1="130" y1="150" x2="130" y2="160"/><path d="M122,160 Q130,172 140,162"/>
    <line x1="160" y1="150" x2="160" y2="182"/>
    <line x1="210" y1="150" x2="210" y2="158"/><path d="M196,158 L224,158 M200,158 L200,166 M220,158 L220,166"/>
    <line x1="240" y1="150" x2="240" y2="162"/><path d="M234,162 Q240,172 246,162"/>
  </g>
  <!-- charango de quirquincho -->
  <ellipse cx="250" cy="222" rx="10" ry="6" fill="#c9b48f"/>
  <!-- camastros a la altura de un adobe -->
  <rect x="107" y="230" width="40" height="10" fill="#6d5f50"/>
  <rect x="222" y="230" width="42" height="10" fill="#6d5f50"/>
  <!-- brasero central -->
  <path d="M178,238 Q185,214 192,238 Z" fill="#c4572a"/>
  <path d="M182,238 Q185,224 188,238 Z" fill="#f2b441"/>
  <!-- figura sentada (escala) -->
  <circle cx="160" cy="207" r="6" fill="#d8cbb5"/>
  <path d="M160,213 L160,230 L172,236" stroke="#d8cbb5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- cruz y huaca -->
  <line x1="185" y1="30" x2="185" y2="62" stroke="#2f2a26" stroke-width="2"/>
  <line x1="177" y1="40" x2="193" y2="40" stroke="#2f2a26" stroke-width="2"/>
  <ellipse cx="185" cy="49" rx="4" ry="3" fill="#b5542b"/>
  </g><!-- rótulos -->
  <g font-size="9" fill="#2f2a26">
    <text x="250" y="36">límite: techo de paja, cruz y huaca (p. 10)</text>
    <text x="14" y="110">apoyo: muros de piedra,</text><text x="14" y="121">vigas atadas</text><text x="14" y="132">con paja (p. 31)</text>
    <text x="14" y="200">vano: la puerta</text><text x="14" y="211">(= órbita; p. 34)</text>
    <text x="150" y="272">masa: hollín, brasero central, camastros de un adobe (pp. 30-31)</text>
    <text x="150" y="286" fill="#b5542b">punto de vista: sentado junto al fuego · luz: extraer por esgrafiado</text>
  </g>
</svg>
