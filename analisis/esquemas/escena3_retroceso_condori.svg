<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770"><defs><marker id="arri" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#222"/></marker><marker id="arrc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c2410c"/></marker></defs><rect width="1100" height="770" fill="white"/><text x="30" y="38" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Escena 3 · El retroceso de Juan Condori (pp. 150-154)</tspan></text><text x="30" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#6b7280" text-anchor="start"><tspan x="30" dy="0">Inventario de lo que da el texto, en sección. No es un boceto de la figura.</tspan></text><line x1="800" y1="24" x2="840" y2="24" stroke="#222" stroke-width="2"/><text x="850" y="28" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="850" dy="0">lo da el texto (con página)</tspan></text><line x1="800" y1="44" x2="840" y2="44" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="48" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="850" dy="0">lo decide y declara el dibujo</tspan></text><text x="800" y="68" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="800" dy="0">gris cursiva: valoración del narrador</tspan></text><rect x="60" y="100" width="50" height="330" rx="0" fill="none" stroke="#222" stroke-width="2"/><rect x="64" y="330" width="42" height="60" rx="0" fill="#d6d3d1" stroke="#222" stroke-width="1.5"/><text x="85" y="95" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="85" dy="0">pozo</tspan></text><circle cx="85" cy="312" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="85" y="316.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="85" dy="0">1</tspan></text><line x1="110" y1="250" x2="700" y2="250" stroke="#222" stroke-width="2.5"/><line x1="110" y1="400" x2="700" y2="400" stroke="#222" stroke-width="2.5"/><line x1="700" y1="250" x2="700" y2="400" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="405" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="405" dy="0">«negro túnel» (p. 152)</tspan></text><line x1="720" y1="250" x2="720" y2="400" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="7 5"/><text x="730" y="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="730" dy="0">alto: ?</tspan></text><line x1="110" y1="440" x2="700" y2="440" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="7 5"/><text x="405" y="458" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="405" dy="0">largo, ancho y pendiente: ?  El orden de los niveles es del texto; las distancias, no.</tspan></text><path d="M110,400 L110,372 L330,372 L330,346 L520,346 L520,338 L700,338 L700,400 z" fill="#9fb4c7" fill-opacity="0.45" stroke="none"/><path d="M110,372 L330,372 L330,346 L520,346 L520,338 L700,338" fill="none" stroke="#222" stroke-width="1.5"/><text x="220" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="220" dy="0">agua a la rodilla (p. 152)</tspan></text><text x="425" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="425" dy="0">barro a la cintura (p. 153)</tspan></text><text x="610" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="610" dy="0">agua al ombligo (p. 153)</tspan></text><circle cx="130" cy="360" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="130" y1="366" x2="130" y2="386" stroke="#222" stroke-width="2"/><line x1="130" y1="386" x2="125" y2="398" stroke="#222" stroke-width="2"/><line x1="130" y1="386" x2="135" y2="398" stroke="#222" stroke-width="2"/><circle cx="136" cy="368" r="3" fill="#f4a261" stroke="#222" stroke-width="0.8"/><circle cx="150" cy="360" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="150" y1="366" x2="150" y2="386" stroke="#222" stroke-width="2"/><line x1="150" y1="386" x2="145" y2="398" stroke="#222" stroke-width="2"/><line x1="150" y1="386" x2="155" y2="398" stroke="#222" stroke-width="2"/><circle cx="170" cy="360" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="170" y1="366" x2="170" y2="386" stroke="#222" stroke-width="2"/><line x1="170" y1="386" x2="165" y2="398" stroke="#222" stroke-width="2"/><line x1="170" y1="386" x2="175" y2="398" stroke="#222" stroke-width="2"/><circle cx="176" cy="368" r="3" fill="#f4a261" stroke="#222" stroke-width="0.8"/><circle cx="190" cy="360" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="190" y1="366" x2="190" y2="386" stroke="#222" stroke-width="2"/><line x1="190" y1="386" x2="185" y2="398" stroke="#222" stroke-width="2"/><line x1="190" y1="386" x2="195" y2="398" stroke="#222" stroke-width="2"/><circ