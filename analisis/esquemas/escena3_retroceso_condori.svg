"398" stroke="#222" stroke-width="2"/><circle cx="230" cy="275" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="230" y="279.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="230" dy="0">2</tspan></text><circle cx="560" cy="356" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="560" y1="362" x2="560" y2="386" stroke="#222" stroke-width="2"/><line x1="560" y1="386" x2="555" y2="398" stroke="#222" stroke-width="2"/><line x1="560" y1="386" x2="565" y2="398" stroke="#222" stroke-width="2"/><circle cx="578" cy="356" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="578" y1="362" x2="578" y2="386" stroke="#222" stroke-width="2"/><line x1="578" y1="386" x2="573" y2="398" stroke="#222" stroke-width="2"/><line x1="578" y1="386" x2="583" y2="398" stroke="#222" stroke-width="2"/><circle cx="596" cy="356" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="596" y1="362" x2="596" y2="386" stroke="#222" stroke-width="2"/><line x1="596" y1="386" x2="591" y2="398" stroke="#222" stroke-width="2"/><line x1="596" y1="386" x2="601" y2="398" stroke="#222" stroke-width="2"/><circle cx="614" cy="356" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="614" y1="362" x2="614" y2="386" stroke="#222" stroke-width="2"/><line x1="614" y1="386" x2="609" y2="398" stroke="#222" stroke-width="2"/><line x1="614" y1="386" x2="619" y2="398" stroke="#222" stroke-width="2"/><circle cx="660" cy="352" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><path d="M652,350 A8,8 0 0 1 668,350 z" fill="#222"/><line x1="660" y1="358" x2="660" y2="386" stroke="#222" stroke-width="2"/><line x1="660" y1="386" x2="655" y2="398" stroke="#222" stroke-width="2"/><line x1="660" y1="386" x2="665" y2="398" stroke="#222" stroke-width="2"/><circle cx="684" cy="330" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="684" y="334.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="684" dy="0">4</tspan></text><circle cx="540" cy="356" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="540" y1="362" x2="540" y2="386" stroke="#222" stroke-width="2"/><line x1="540" y1="386" x2="535" y2="398" stroke="#222" stroke-width="2"/><line x1="540" y1="386" x2="545" y2="398" stroke="#222" stroke-width="2"/><circle cx="534" cy="346" r="3.5" fill="#f4a261" stroke="#222" stroke-width="0.8"/><line x1="530" y1="300" x2="480" y2="300" stroke="#222" stroke-width="2" marker-end="url(#arri)"/><text x="505" y="292" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#222" text-anchor="middle"><tspan x="505" dy="0">tres pasos</tspan></text><circle cx="556" cy="278" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="556" y="282.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="556" dy="0">3</tspan></text><path d="M652,344 Q600,318 548,350" fill="none" stroke="#b91c1c" stroke-width="1.8"/><circle cx="600" cy="312" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="600" y="316.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="600" dy="0">5</tspan></text><rect x="520" y="250" width="180" height="12" rx="0" fill="#8b5e3c" stroke="#222" stroke-width="1.5"/><path d="M608,250 l6,6 l-6,6" fill="none" stroke="white" stroke-width="2"/><circle cx="700" cy="236" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="700" y="240.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="700" dy="0">6</tspan></text><circle cx="790" cy="116" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="120.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">1</tspan></text><text x="808" y="120" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">La jaula «atracó» en el fondo y «los</tspan><tspan x="808" dy="16">hombres salieron al negro túnel» (p.</tspan><tspan x="808" dy="16">152). Bajan quince (p. 151).</tspan></text><circle cx="790" cy="171" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="175.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">2</tspan></text><text x="808" y="175" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">Los que se quedan atrás con sus</tspan><tspan x="808" dy="16">mecheros: «Ya no se distinguía la luz»</tspan><tspan x="808" dy="16">de ellos (p. 153).</tspan></text><circle cx="790" cy="226" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="230.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">3</tspan></text><text x="808" y="230" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">Condori, con «el brazo levantado donde</tspan><tspan x="808" dy="16">lucía la lamparilla», quiere «volver»:</tspan><tspan x="808" dy="16">«Apenas alcanzó a dar tres pasos» (p.</tspan><tspan x="808" dy="16">153).</tspan></text><circle cx="790" cy="297" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="301.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">4</tspan></text><text x="808" y="301" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">Williams: «casco protector y altas botas</tspan><tspan x="808" dy="16">de goma» (p. 152), «el embarrado</tspan><tspan x="808" dy="16">revólver» (p. 153). Cinco lo siguen (p.</tspan><tspan x="808" dy="16">152).</tspan></text><circle cx="790" cy="368" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="372.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">5</tspan></text><text x="808" y="372" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">El disparo: el «Colt» le abre «un</tspan><tspan x="808" dy="16">boquete en la cabeza»; cae «de bruces al</tspan><tspan x="808" dy="16">agua» (p. 153).</tspan></text><circle cx="790" cy="423" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="790" y="427.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="790" dy="0">6</tspan></text><text x="808" y="427" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="808" dy="0">«Quebróse la viga del techo» y el</tspan><tspan x="808" dy="16">derrumbe sepulta a los seis (p. 154).</tspan></text><text x="60" y="500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="60" dy="0">Cadena (pp. 150-154): el «450» se inunda y las bombas tardan → la empresa baja ciento veinte hombres y dobla el jornal → sacan a un peón «con los</tspan><tspan x="60" dy="16">sesos aplastados» y los obreros se niegan → voluntarios: bajan quince → acarrean vigas y hierro con el agua a la rodilla → «cien bolivianos de</tspan><tspan x="60" dy="16">propina»: avanzan cinco con Williams → barro a la cintura, negativa → «¡al que retroceda le meto un plomo!» → agua al ombligo, Condori retrocede,</tspan><tspan x="60" dy="16">disparo → la viga se quiebra, derrumbe.</tspan></text><text x="60" y="590" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="60" dy="0">Posición de cada cuerpo, distancia entre los grupos y dirección exacta de la salida: el texto no las da. El dibujo debe proponerlas como conjetura y</tspan><tspan x="60" dy="16">declararlo.</tspan></text><text x="60" y="636" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="60" dy="0">Valoraciones del narrador: siguen a Williams «como se sigue a un sugestionador irresistible»; «¿Qué ambición sin sustancia ni esperanza le quitó la</tspan><tspan x="60" dy="16">razón?» (p. 153); «el gringo asesino» (p. 154).</tspan></text><text x="30" y="720" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Pregunta del artículo: ¿puede el dibujo mostrar quién cierra la salida? Una forma oscura y opresiva sugiere el peligro, pero no</tspan><tspan x="30" dy="18">explica una oferta salarial ni un disparo.</tspan></text></svg>
