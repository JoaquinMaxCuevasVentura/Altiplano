<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="320" height="440" fill="#1f2433"/>
  <text x="12" y="22" font-size="12" font-weight="bold" fill="#f1e9dc">Fig. 5 · El centinela de la resistencia</text>
  <text x="12" y="36" font-size="9" fill="#c9c0b1">esquema (nocturno vertical)</text>
  <!-- estrellas: Sirio y Marte como coágulos (p. 72) -->
  <g fill="#e8e0d0"><circle cx="40" cy="70" r="1.2"/><circle cx="90" cy="95" r="1"/><circle cx="160" cy="60" r="1.3"/><circle cx="210" cy="110" r="1"/><circle cx="280" cy="80" r="1.1"/></g>
  <circle cx="120" cy="120" r="3" fill="#c4572a"/><circle cx="250" cy="150" r="2.5" fill="#c4572a"/>
  <text x="128" y="124" font-size="8" fill="#e0b3a0">Sirio / Marte (p. 72)</text>
  <!-- campanario con buitres -->
  <rect x="245" y="220" width="30" height="120" fill="#3a3f52"/><path d="M245,220 l15,-24 l15,24 Z" fill="#3a3f52"/>
  <g stroke="#c9c0b1" stroke-width="1.5" fill="none"><path d="M250,190 l5,4 l5,-4"/><path d="M262,184 l5,4 l5,-4"/></g>
  <text x="200" y="360" font-size="8" fill="#c9c0b1">campanario, «aquella atalaya» (p. 79)</text>
  <!-- horizonte bajo -->
  <rect x="0" y="340" width="320" height="100" fill="#4a4336"/>
  <!-- chujlla de los Villca -->
  <rect x="40" y="270" width="160" height="70" fill="#5b5243"/><path d="M30,272 Q120,226 210,272 Z" fill="#6e6452"/>
  <rect x="95" y="290" width="50" height="50" fill="#14161f"/>
  <!-- tres vigías como postes + cayado -->
  <g stroke="#e8e0d0" stroke-width="5" stroke-linecap="round"><line x1="105" y1="296" x2="105" y2="338"/><line x1="120" y1="292" x2="120" y2="338"/><line x1="135" y1="296" x2="135" y2="338"/></g>
  <line x1="152" y1="300" x2="160" y2="338" stroke="#c9b48f" stroke-width="2"/>
  <!-- puertas batidas -->
  <path d="M200,300 l18,-8 l0,40 l-18,8 Z" fill="none" stroke="#c9c0b1"/>
  <!-- muertos que salen a mirar el cielo -->
  <g fill="#e8e0d0" opacity="0.35"><ellipse cx="60" cy="360" rx="10" ry="18"/><ellipse cx="180" cy="372" rx="8" ry="14"/><ellipse cx="290" cy="380" rx="9" ry="16"/></g>
  <g font-size="8.5" fill="#f1e9dc">
    <text x="12" y="410">tres vigías = postes/mojones; cayado de Braulio = 4.º apoyo (p. 75)</text>
    <text x="12" y="423">muertos que salen «para mirar el cielo» (p. 80): veladuras de dedo</text>
    <text x="12" y="260">chujlla de los Villca, «la más amplia y cómoda» (p. 79)</text>
  </g>
</svg>
