<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800"><defs><marker id="arri" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#222"/></marker><marker id="arrc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c2410c"/></marker></defs><rect width="1100" height="800" fill="white"/><text x="30" y="38" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Escena 1 · La junta nocturna de los Huanca (pp. 29-34)</tspan></text><text x="30" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#6b7280" text-anchor="start"><tspan x="30" dy="0">Inventario de lo que da el texto, en planta. No es un boceto de la figura.</tspan></text><line x1="800" y1="24" x2="840" y2="24" stroke="#222" stroke-width="2"/><text x="850" y="28" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="850" dy="0">lo da el texto (con página)</tspan></text><line x1="800" y1="44" x2="840" y2="44" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="48" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="850" dy="0">lo decide y declara el dibujo</tspan></text><text x="800" y="68" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="800" dy="0">gris cursiva: valoración del narrador</tspan></text><rect x="60" y="130" width="500" height="380" rx="0" fill="#faf6ef" stroke="#222" stroke-width="2.5"/><text x="60" y="122" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="60" dy="0">Las chujllas: «Rectangulares y chatas, apenas se alzan dos metros del suelo»; sin cuartos (p. 30)</tspan></text><line x1="60" y1="528" x2="560" y2="528" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="310" y="546" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="310" dy="0">largo y ancho: ?</tspan></text><circle cx="320" cy="320" r="26" fill="#f4a261" stroke="#222" stroke-width="2"/><circle cx="320" cy="280" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="320" y="284.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="320" dy="0">1</tspan></text><circle cx="272" cy="320" r="11" fill="#222" stroke="#222" stroke-width="2"/><circle cx="272" cy="348" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="272" y="352.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="272" dy="0">2</tspan></text><circle cx="234" cy="320" r="11" fill="#222" stroke="#222" stroke-width="2"/><circle cx="234" cy="348" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="234" y="352.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="234" dy="0">3</tspan></text><circle cx="384" cy="292" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="384" cy="320" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="384" cy="348" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="414" cy="320" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="414" y="324.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="414" dy="0">4</tspan></text><circle cx="120" cy="150" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="150" cy="150" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="180" cy="150" r="10" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="210" cy="150" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="210" y="154.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="210" dy="0">5</tspan></text><rect x="90" y="420" width="120" height="60" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="150" y="455" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="150" dy="0">jergón</tspan></text><ellipse cx="196" cy="428" rx="9" ry="5" fill="white" stroke="#c2410c" stroke-width="1.5"/><circle cx="196" cy="428" r="2.2" fill="#c2410c"/><line x1="205" y1="424" x2="296" y2="338" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#arrc)"/><circle cx="75" cy="450" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="75" y="454.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="75" dy="0">6</tspan></text><line x1="380" y1="142" x2="520" y2="142" stroke="#c2410c" stroke-width="4" stroke-dasharray="7 5"/><path d="M448,152 q6,-10 0,-18 q-6,8 0,18 z" fill="#f4a261" stroke="#c2410c" stroke-width="1"/><circle cx="540" cy="160" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="540" y="164.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="540" dy="0">7</tspan></text><rect x="68" y="190" width="28" height="120" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><rect x="524" y="210" width="28" height="120" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><circle cx="82" cy="175" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="82" y="179.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="82" dy="0">8</tspan></text><line x1="290" y1="510" x2="350" y2="510" stroke="white" stroke-width="5"/><line x1="290" y1="510" x2="350" y2="510" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="320" y="500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="320" dy="0">?</tspan></text><line x1="560" y1="380" x2="560" y2="440" stroke="white" stroke-width="5"/><line x1="560" y1="380" x2="560" y2="440" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="548" y="415" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="548" dy="0">?</tspan></text><circle cx="380" cy="488" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="380" y="492.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="380" dy="0">9</tspan></text><rect x="488" y="448" width="60" height="50" rx="0" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="518" y="477" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="518" dy="0">telares</tspan></text><circle cx="470" cy="440" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="470" y="444.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="470" dy="0">11</tspan></text><text x="70" y="578" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="70" dy="0">10 · Arriba, colgado de las vigas: hoces, arado, yugo, ponchos (p. 31). Fuera:</tspan><tspan x="70" dy="16">viento de invierno; las otras dos chujllas y el patio (p. 30); los hijos</tspan><tspan x="70" dy="16">llegan desde «las chozas próximas» (p. 31).</tspan></text><text x="70" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="70" dy="0">Cifras del texto: 12 personas, 4 hectáreas y 7 ovejas (p. 30); 10 bolivianos</tspan><tspan x="70" dy="16">para cada hijo que se va (p. 33).</tspan></text><text x="70" y="684" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#6b7280" text-anchor="start"><tspan x="70" dy="0">Valoraciones del narrador, que el dibujo no debe tomar por datos: la «actitud</tspan><tspan x="70" dy="16">hierática» del padre; las mujeres «como esfinges», con trenzas «como sierpes»</tspan><tspan x="70" dy="16">(p. 32); su «cara de tártaro» (p. 34).</tspan></text><circle cx="610" cy="136" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="610" y="140.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="610" dy="0">1</tspan></text><text x="628" y="140" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="628" dy="0">Fogón en «el centro del cuarto» (p. 30); su</tspan><tspan x="628" dy="16">«resplandor» cae al suelo (p. 32).</tspan></text><circle cx="610" cy="175" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="610" y="179.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="610" dy="0">2</tspan></text><text x="628" y="179" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="628" dy="0">Paulo, «en cuclillas, cerca del fuego»; no se atreve</tspan><tspan x="628" dy="16">a mirar a los hijos (p. 32).</tspan></text><circle cx="610" cy="214" r="10" fill="white" stroke="#222" stroke-width="1.5"/><text x="610" y="218.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222" text-anchor="middle"><tspan x="610" dy="0">3</tspan></text><text x="628" y="218" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#222" text-anchor="start"><tspan x="628" dy="0">La mamacuna, «detrás, y en igual postura», escarmena</tspan><tspan x="628" dy="16">lana negra (p. 32).</tspan></text><circle cx="610" cy="253" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="257.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">4</tspan></text><text x="628" y="257" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">Justino, Manuelo y Pablo toman sitio «frente a sus</tspan><tspan x="628" dy="16">padres» (p. 32). ¿Al otro lado del fuego?</tspan></text><circle cx="610" cy="292" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="296.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">5</tspan></text><text x="628" y="296" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">Las mujeres, «apoyadas contra la pared» (p. 32).</tspan><tspan x="628" dy="16">¿Qué pared?</tspan></text><circle cx="610" cy="331" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="335.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">6</tspan></text><text x="628" y="335" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">Las guaguas, en un jergón, «atisbaban, insomnes, la</tspan><tspan x="628" dy="16">junta» (pp. 31-32): un punto de vista que el propio</tspan><tspan x="628" dy="16">texto ofrece.</tspan></text><circle cx="610" cy="386" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="390.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">7</tspan></text><text x="628" y="390" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">La «mecha de sebo» en una larga repisa, con las</tspan><tspan x="628" dy="16">gallinas dormidas (p. 31). ¿Dónde? Con el fogón, son</tspan><tspan x="628" dy="16">dos fuentes de luz.</tspan></text><circle cx="610" cy="441" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="445.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">8</tspan></text><text x="628" y="445" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">Camastros «a los costados de la choza», contra la</tspan><tspan x="628" dy="16">pared (p. 30).</tspan></text><circle cx="610" cy="480" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="484.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">9</tspan></text><text x="628" y="484" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">La puerta que «el viento gélido rasguñaba» (p. 31).</tspan><tspan x="628" dy="16">¿En qué muro?</tspan></text><circle cx="610" cy="519" r="10" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="523.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c2410c" text-anchor="middle"><tspan x="610" dy="0">11</tspan></text><text x="628" y="523" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#c2410c" text-anchor="start"><tspan x="628" dy="0">Telares abandonados «en la más oscura esquina» (p.</tspan><tspan x="628" dy="16">29). ¿Están en esta chujlla?</tspan></text><text x="30" y="772" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#222" text-anchor="start"><tspan x="30" dy="0">Pregunta del artículo: ¿puede una sección de la chujlla mostrar a la vez quién queda dentro y quién debe salir? ¿Qué se pierde</tspan><tspan x="30" dy="18">si la imagen omite las cuatro hectáreas que no alcanzan?</tspan></text></svg>
