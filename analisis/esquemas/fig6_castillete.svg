<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="320" height="500" fill="#141414"/>
  <text x="12" y="20" font-size="12" font-weight="bold" fill="#f1e9dc">Fig. 6 · El castillete y la caída al 450</text>
  <text x="12" y="34" font-size="9" fill="#c9c0b1">esquema (vertical)</text>
  <!-- luces: topacios y rubíes -->
  <g fill="#f2b441"><circle cx="60" cy="100" r="2"/><circle cx="230" cy="92" r="2"/></g><g fill="#c4572a"><circle cx="80" cy="112" r="2"/><circle cx="250" cy="104" r="2"/></g>
  <!-- torre como encaje -->
  <g stroke="#d8d2c8" stroke-width="1" fill="none"><path d="M140,130 L150,50 L160,130"/><path d="M142,115 L158,115 M144,98 L156,98 M146,80 L154,80"/><path d="M142,115 L156,98 L144,80 M158,115 L144,98 L156,80"/></g>
  <!-- desmonte = montaña de piedras -->
  <path d="M190,130 L240,78 L300,130 Z" fill="#6e6452"/>
  <text x="196" y="52" font-size="8" fill="#e0c9a0">desmonte (p. 140) =</text><text x="196" y="62" font-size="8" fill="#e0c9a0">«montaña de piedras» (p. 9)</text>
  <!-- campamento escalonado -->
  <g fill="#8a8272"><rect x="14" y="108" width="22" height="22"/><circle cx="46" cy="124" r="5" fill="#5f7a55"/><rect x="60" y="116" width="12" height="14"/><rect x="75" y="116" width="12" height="14"/><rect x="90" y="116" width="12" height="14"/><rect x="108" y="122" width="7" height="8"/><rect x="118" y="122" width="7" height="8"/><rect x="128" y="122" width="7" height="8"/></g>
  <text x="12" y="146" font-size="8" fill="#c9c0b1">chalets · filas «como cuadras de un cuartel» · cuchitriles (p. 135)</text>
  <!-- superficie -->
  <line x1="0" y1="130" x2="320" y2="130" stroke="#8a8272" stroke-width="2"/>
  <!-- roca -->
  <rect x="0" y="131" width="320" height="369" fill="#2a2724"/>
  <!-- nichos -->
  <path d="M112,170 v-18 a8,8 0 0,1 16,0 v18 Z" fill="#141414"/><path d="M172,170 v-18 a8,8 0 0,1 16,0 v18 Z" fill="#141414"/>
  <text x="196" y="162" font-size="8" fill="#c9c0b1">«dos enormes nichos» (p. 141)</text>
  <!-- pique -->
  <rect x="140" y="170" width="20" height="290" fill="#0c0c0c"/>
  <!-- jaula con siete cuerpos y rejilla -->
  <rect x="136" y="215" width="28" height="40" fill="#3b3530" stroke="#d8d2c8"/>
  <g fill="#c9a88a"><circle cx="142" cy="224" r="2.5"/><circle cx="150" cy="222" r="2.5"/><circle cx="158" cy="224" r="2.5"/><circle cx="145" cy="236" r="2.5"/><circle cx="153" cy="235" r="2.5"/><circle cx="160" cy="238" r="2.5"/><circle cx="148" cy="247" r="2.5"/></g>
  <g stroke="#d8d2c8" stroke-width="0.8"><line x1="143" y1="215" x2="143" y2="255"/><line x1="150" y1="215" x2="150" y2="255"/><line x1="157" y1="215" x2="157" y2="255"/><line x1="136" y1="230" x2="164" y2="230"/><line x1="136" y1="243" x2="164" y2="243"/></g>
  <text x="172" y="232" font-size="8" fill="#e0b3a0">jaula: cuerpos con el dedo,</text><text x="172" y="242" font-size="8" fill="#e0b3a0">rejilla esgrafiada (p. 143)</text>
  <!-- niveles -->
  <g stroke="#6e6452" stroke-width="10"><line x1="160" y1="300" x2="300" y2="300"/><line x1="20" y1="350" x2="140" y2="350"/><line x1="160" y1="430" x2="310" y2="430"/></g>
  <g font-size="8" fill="#c9c0b1"><text x="262" y="294">«300»</text><text x="24" y="344">«350»</text><text x="170" y="424">«450»</text></g>
  <!-- agua que sube y derrumbe -->
  <rect x="160" y="428" width="150" height="8" fill="#b89b3e" opacity="0.8"/>
  <path d="M250,436 L275,405 L300,436 Z" fill="#6e6452"/>
  <line x1="243" y1="436" x2="243" y2="424" stroke="#c9a88a" stroke-width="2"/><line x1="238" y1="420" x2="248" y2="420" stroke="#c9a88a" stroke-width="2"/>
  <g font-size="8" fill="#f1e9dc">
    <text x="12" y="470">agua copajira (p. 136): pastel disuelto que sube por los cuerpos</text>
    <text x="12" y="483">viga que se quiebra: falla el apoyo (p. 154) · «informe montón» (p. 154)</text>
  </g>
</svg>
